<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivek DevOps CI/CD Project</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.hero{max-width:900px;margin:80px auto;padding:40px;text-align:center;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{font-size:42px}.status{display:inline-block;padding:10px 18px;border-radius:999px;background:#dff7e7;color:#137333;font-weight:bold}
.stack{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:25px}.stack span{padding:10px 14px;background:#eef2f7;border-radius:10px}
footer{margin-top:30px;color:#697386;font-size:14px}
</style>
</head>
<body>
<main class="hero">
<h1>🚀 Vivek CI/CD Demo</h1>
<div class="status">Deployment Done</div>
<p>This website is built and deployed through a CI/CD pipeline.</p>
<p><strong>GitHub → Jenkins → Docker → Nginx → AWS EC2</strong></p>
<div class="stack"><span>GitHub</span><span>Jenkins</span><span>Docker</span><span>Nginx</span><span>AWS EC2</span></div>
<footer>Built for DevOps practice</footer>
</main>
</body>
</html>
